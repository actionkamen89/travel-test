      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;

    svg { width: 100%; height: auto; display: block; }
    .state {
      fill: #334155;
      stroke: #0f172a;
      stroke-width: 1;
      cursor: pointer;
      transition: fill 0.3s;
    }
    .state:hover { fill: #60a5fa; }
    .state.active {
      fill: #22c55e;
      filter: drop-shadow(0 0 5px #22c55e99);
    }
    #toast {
      margin-top: 14px;
      padding: 8px 22px;
      border: 1px solid #22c55e;
      border-radius: 999px;
      color: #22c55e;
      background: #22c55e18;
      display: none;
    }
    #count { margin-top: 8px; color: #64748b; font-size: 0.82rem; }

    "jammu kashmir":"jammu-kashmir","ladakh":"ladakh",
    "andaman and nicobar":"andaman-nicobar","chandigarh":"chandigarh",
    "puducherry":"puducherry","pondicherry":"puducherry","lakshadweep":"lakshadweep"
  };

  const params = new URLSearchParams(window.location.search);
  const raw = params.get("state") ? params.get("state").toLowerCase().trim() : null;
  const scannedId = raw ? (aliases[raw] || raw.replace(/\s+/g,"-")) : null;

  let completed = JSON.parse(localStorage.getItem("india_travel") || "[]");
  if (scannedId && !completed.includes(scannedId)) {
    completed.push(scannedId);
    localStorage.setItem("india_travel", JSON.stringify(completed));
  }

  const W = 480, H = 560;
  const svg = d3.select("#india-map").attr("viewBox",`0 0 ${W} ${H}`);
  const proj = d3.geoMercator().center([82.5,22]).scale(800).translate([W/2,H/2]);
  const path = d3.geoPath().projection(proj);

  svg.selectAll(".state")
    .data(indiaGeo.features)
    .enter().append("path")
    .attr("class", d => "state"+(completed.includes(d.id)?" active":""))
    .attr("d", path)
    .append("title").text(d => d.properties.name);

  if (scannedId) {
    const feat = indiaGeo.features.find(f=>f.id===scannedId);
    const name = feat ? feat.properties.name : raw;
    document.getElementById("title").textContent = "🎉 "+name+" unlocked!";
    const t = document.getElementById("toast");
    t.textContent = "✅ "+name+" added to your map!";
    t.style.display = "inline-block";
  }
