<!DOCTYPE html>
<html>
<head>
    <title>India Travel Map</title>
</head>
<body style="text-align:center; font-family:sans-serif;">

<h1 id="title">🇮🇳 Travel Map</h1>

<svg viewBox="0 0 500 500" style="width:350px;">

    <!-- SIMPLIFIED INDIA STATES (REAL SHAPE STYLE) -->

    <path id="maharashtra" d="M120,250 L200,240 L210,300 L140,310 Z" fill="gray"/>
    <path id="goa" d="M150,310 L165,310 L165,330 L150,330 Z" fill="gray"/>
    <path id="kerala" d="M180,360 L200,360 L200,420 L180,420 Z" fill="gray"/>
    <path id="delhi" d="M240,140 L255,140 L255,155 L240,155 Z" fill="gray"/>
    <path id="rajasthan" d="M100,150 L180,140 L170,220 L110,210 Z" fill="gray"/>
    <path id="karnataka" d="M150,310 L220,300 L220,360 L160,370 Z" fill="gray"/>
    <path id="tamilnadu" d="M220,360 L260,360 L260,430 L220,430 Z" fill="gray"/>

</svg>

<script>
let params = new URLSearchParams(window.location.search);
let state = params.get("state");

// get saved states
let completed = JSON.parse(localStorage.getItem("states")) || [];

// add new state
if(state && !completed.includes(state.toLowerCase())){
    completed.push(state.toLowerCase());
    localStorage.setItem("states", JSON.stringify(completed));
}

// highlight states
completed.forEach(s => {
    let el = document.getElementById(s);
    if(el){
        el.style.fill = "green";
    }
});

// update title
if(state){
    document.getElementById("title").innerText = "🎉 " + state + " unlocked!";
}
</script>

</body>
</html>
